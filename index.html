<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Estas metas hacen que, agregada a la pantalla de inicio, abra a pantalla completa
       como una app y no como una pestaña de Safari. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym">
  <meta name="theme-color" content="#0f1012">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Gym</title>
</head>
<body>
  <header id="topbar"><h1 id="title">Gym</h1></header>
  <main id="view"></main>
  <nav id="tabs">
    <button data-tab="entrenar"><span class="i">🏋️</span>Entrenar</button>
    <button data-tab="historial"><span class="i">📅</span>Historial</button>
    <button data-tab="rutinas"><span class="i">📋</span>Planillas</button>
    <button data-tab="gym"><span class="i">🏢</span>Gimnasio</button>
    <button data-tab="claude"><span class="i">✨</span>Claude</button>
  </nav>
  <div id="sheet" hidden><div class="panel"></div></div>
  <div id="toast" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
